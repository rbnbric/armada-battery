name: armada-battery

services:
  battery:
    image: ghcr.io/rbnbric/armada-battery:latest
    build:
      context: .
      target: runtime
    environment:
      BATTERY_LEDGER_PATH: /app/var/ledger.jsonl
    ports:
      - "127.0.0.1:${BATTERY_PORT:-8080}:8080"
    volumes:
      - battery-data:/app/var
    restart: unless-stopped

  proof:
    image: ghcr.io/rbnbric/armada-battery:latest
    build:
      context: .
      target: runtime
    command: ["python", "scripts/run_scenarios.py"]
    profiles: ["tools"]

  test:
    build:
      context: .
      target: test
    profiles: ["tools"]

volumes:
  battery-data:
