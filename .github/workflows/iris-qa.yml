name: IRIS startup and Battery smoke

on:
  push:
    branches: [main, fix/iris-password-init]
    paths:
      - .env.example
      - .github/workflows/iris-qa.yml
      - Dockerfile
      - app.py
      - battery/**
      - compose.yaml
      - compose.iris.yaml
      - requirements.txt
      - scripts/verify_container.py
  workflow_dispatch:

jobs:
  iris:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Start a fresh IRIS-backed stack
        run: |
          cp .env.example .env
          sed -i 's/^IRIS_PASSWORD=.*/IRIS_PASSWORD=QaOnlyPass-2026-Strong/' .env
          docker compose -p battery-iris-qa -f compose.yaml -f compose.iris.yaml up --build -d
      - name: Verify live read and blocked mutation
        run: docker compose -p battery-iris-qa -f compose.yaml -f compose.iris.yaml exec -T battery python scripts/verify_container.py
      - name: Capture startup logs on failure
        if: failure()
        run: docker compose -p battery-iris-qa -f compose.yaml -f compose.iris.yaml logs --no-color --tail=160 iris-init iris battery
      - name: Remove disposable QA stack
        if: always()
        run: docker compose -p battery-iris-qa -f compose.yaml -f compose.iris.yaml down -v
