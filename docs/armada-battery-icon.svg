<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Armada Battery — console palette</title>
  <desc id="desc">An amber-topped graphite battery with a broad reflected highlight, shaded left edge, and white AB plus lettering.</desc>
  <defs>
    <linearGradient id="rim" x2=".8" y2="1"><stop stop-color="#A3AAB2"/><stop offset=".45" stop-color="#2B3036"/><stop offset="1" stop-color="#16191C"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#826331"/><stop offset=".18" stop-color="#BC9145"/><stop offset=".4" stop-color="#E3B254"/><stop offset=".64" stop-color="#D1A24D"/><stop offset="1" stop-color="#8C6C35"/></linearGradient>
    <linearGradient id="graphite" x2="1" y2=".3"><stop stop-color="#0F1113"/><stop offset=".35" stop-color="#1D2125"/><stop offset=".62" stop-color="#16191C"/><stop offset="1" stop-color="#0F1113"/></linearGradient>
    <linearGradient id="edgeShade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#000000" stop-opacity=".38"/>
      <stop offset=".065" stop-color="#000000" stop-opacity=".6"/>
      <stop offset=".15" stop-color="#000000" stop-opacity=".14"/>
      <stop offset=".28" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".88" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".36"/>
    </linearGradient>
    <linearGradient id="reflectionCopper" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".64" stop-color="#FFF0D0" stop-opacity="0"/>
      <stop offset=".73" stop-color="#FFF0D0" stop-opacity=".12"/>
      <stop offset=".78" stop-color="#FFF0D0" stop-opacity=".58"/>
      <stop offset=".82" stop-color="#FFF0D0" stop-opacity=".72"/>
      <stop offset=".86" stop-color="#FFF0D0" stop-opacity=".22"/>
      <stop offset=".94" stop-color="#FFF0D0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflectionBlack" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".64" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".73" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset=".78" stop-color="#E6E8EA" stop-opacity=".2"/>
      <stop offset=".82" stop-color="#E6E8EA" stop-opacity=".32"/>
      <stop offset=".86" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset=".94" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body"><rect x="43" y="43" width="426" height="426" rx="81"/></clipPath>
    <filter id="shadow" x="-30%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#19242C" flood-opacity=".2"/></filter>
  </defs>
  <rect x="38" y="38" width="436" height="436" rx="86" fill="url(#rim)" filter="url(#shadow)"/>
  <g clip-path="url(#body)">
    <rect x="43" y="43" width="426" height="426" fill="url(#metal)"/>
    <path d="M43 224h426v245H43Z" fill="url(#graphite)"/>
    <path d="M43 224h426" stroke="#E3B254" stroke-opacity=".65" stroke-width="2"/>
    <!-- Reflections belong to the casing and change strength by material. -->
    <rect x="43" y="43" width="426" height="426" fill="url(#edgeShade)"/>
    <rect x="43" y="43" width="426" height="181" fill="url(#reflectionCopper)"/>
    <rect x="43" y="224" width="426" height="245" fill="url(#reflectionBlack)"/>
    <g fill="#E6E8EA" fill-rule="evenodd" transform="translate(8 -1)">
      <path d="M70 405l27-70h23l27 70h-20l-5-15H95l-5 15Zm30-31h17l-8.5-25Z"/>
      <path d="M157 335h32c20 0 29 7 29 19 0 8-4 14-11 17 10 2 15 8 15 16 0 12-10 18-30 18h-35Zm19 15v14h12c8 0 11-2 11-7s-3-7-11-7Zm0 28v12h15c8 0 12-1 12-6s-4-6-12-6Z"/>
    </g>
    <path d="M266 346v38m-19-19h38" fill="none" stroke="#E6E8EA" stroke-width="8" stroke-linecap="round"/>
  </g>
  <rect x="44" y="44" width="424" height="424" rx="80" fill="none" stroke="#A3AAB2" stroke-opacity=".35" stroke-width="2"/>
</svg>
