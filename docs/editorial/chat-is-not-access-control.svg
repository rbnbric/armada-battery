<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">A code freeze written in chat is not access control</title>
  <desc id="desc">Editorial pull quote about technical boundaries for AI coding agents, inspired by the public Replit and SaaStr database incident of 2025.</desc>
  <rect width="1600" height="700" fill="#132625"/>
  <rect x="0" y="0" width="18" height="700" fill="#e8b65c"/>
  <path d="M1280 92v485M1352 92v485M1424 92v485M1496 92v485" stroke="#35615b" stroke-width="2"/>
  <path d="M1230 125h323M1230 205h323M1230 285h323M1230 365h323M1230 445h323M1230 525h323" stroke="#35615b" stroke-width="2"/>
  <path d="M1230 125v323h266" fill="none" stroke="#e8b65c" stroke-width="7"/>
  <circle cx="1230" cy="448" r="17" fill="#e8b65c"/>
  <text x="96" y="116" fill="#e8b65c" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" letter-spacing="5">A BOUNDARY IS A PRODUCT FEATURE</text>
  <text x="94" y="270" fill="#f7f0e2" font-family="Georgia,'Times New Roman',serif" font-size="78">A code freeze written in chat</text>
  <text x="94" y="365" fill="#f7f0e2" font-family="Georgia,'Times New Roman',serif" font-size="78">is not access control.</text>
  <line x1="98" y1="442" x2="1160" y2="442" stroke="#7b9b92" stroke-width="2"/>
  <text x="99" y="495" fill="#c8d3ca" font-family="Arial,Helvetica,sans-serif" font-size="28">The agent should not be able to reach production data</text>
  <text x="99" y="534" fill="#c8d3ca" font-family="Arial,Helvetica,sans-serif" font-size="28">just because the conversation says it will not.</text>
  <text x="99" y="635" fill="#e8b65c" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="3">ARMADA BATTERY  /  LET CREATIVITY LEAD. MAKE EXECUTION ANSWERABLE.</text>
</svg>
