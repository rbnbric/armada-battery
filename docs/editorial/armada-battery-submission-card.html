<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Armada Battery — our submission</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1600px; height: 900px; margin: 0; overflow: hidden; }
    body { background: #f4f0e7; color: #142725; font-family: Arial, Helvetica, sans-serif; }
    main { position: relative; width: 1600px; height: 900px; padding: 42px 56px 0; }
    .eyebrow { display: flex; align-items: center; justify-content: space-between; color: #9d6a21; font-size: 20px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
    .eyebrow .right { color: #52716a; font-size: 16px; letter-spacing: 2.4px; }
    .screen { position: relative; margin-top: 26px; width: 1488px; height: 593px; overflow: hidden; border: 5px solid #17302f; box-shadow: 0 12px 30px rgba(19, 38, 37, .14); background: #111719; }
    .screen img { display: block; width: 100%; height: auto; }
    .caption { position: relative; margin-top: 34px; display: grid; grid-template-columns: 1fr auto; align-items: end; border-top: 2px solid #cabda9; padding-top: 23px; }
    .caption .label { display: block; color: #a9701e; font-size: 18px; font-weight: 700; letter-spacing: 3.4px; margin-bottom: 7px; }
    .caption h1 { margin: 0; font: normal 57px/1 Georgia, 'Times New Roman', serif; letter-spacing: -.5px; }
    .caption p { margin: 10px 0 0; color: #53625c; font-size: 21px; }
    .mark { width: 84px; height: 84px; object-fit: contain; margin-bottom: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span>Armada Battery / Project study</span><span class="right">InterSystems IRIS</span></div>
    <div class="screen"><img src="../screenshots/battery-console-desktop.png" alt="Armada Battery synthetic demonstration overview showing eight of eight checks passed"></div>
    <div class="caption">
      <div>
        <span class="label">Our submission</span>
        <h1>Armada Battery</h1>
        <p>Evidence-driven change control for InterSystems IRIS · synthetic walkthrough shown</p>
      </div>
      <img class="mark" src="../armada-battery-logo.png" alt="" aria-hidden="true">
    </div>
  </main>
</body>
</html>
