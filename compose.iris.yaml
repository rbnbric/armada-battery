services:
  iris-init:
    image: ${IRIS_IMAGE:-containers.intersystems.com/intersystems/iris-community:latest-cd}
    user: "root"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        password_length=$${#IRIS_PASSWORD}
        if [ "$$password_length" -lt 8 ] || [ "$$password_length" -gt 32 ]; then
          echo >&2 "IRIS_PASSWORD must be 8–32 characters for IRIS and Web Gateway initialization."
          exit 1
        fi
        chown 51773:51773 /durable
        umask 077
        printf '%s\n' "$$IRIS_PASSWORD" > /durable/password.txt
        chown 51773:51773 /durable/password.txt
    environment:
      IRIS_PASSWORD: ${IRIS_PASSWORD:?Set IRIS_PASSWORD in .env}
    volumes:
      - iris-data:/durable

  iris:
    image: ${IRIS_IMAGE:-containers.intersystems.com/intersystems/iris-community:latest-cd}
    depends_on:
      iris-init:
        condition: service_completed_successfully
    environment:
      ISC_DATA_DIRECTORY: /durable/iris
    ports:
      - "127.0.0.1:${IRIS_PORT:-52773}:52773"
      - "127.0.0.1:${IRIS_SUPERSERVER_PORT:-1972}:1972"
    volumes:
      - iris-data:/durable
    command: ["--password-file", "/durable/password.txt"]
    restart: unless-stopped

  battery:
    environment:
      BATTERY_IRIS_URL: http://iris:52773/api/admin
      BATTERY_IRIS_USER: _SYSTEM
      BATTERY_IRIS_PASSWORD: ${IRIS_PASSWORD:?Set IRIS_PASSWORD in .env}
      BATTERY_ALLOW_CHANGES: "false"
      BATTERY_RULE_VALIDATION: DRAFT
    depends_on:
      - iris

volumes:
  iris-data:
